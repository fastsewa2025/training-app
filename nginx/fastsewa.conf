# ─────────────────────────────────────────────────────────────────────────────
# FastSewa Nginx Config
# Place at: /etc/nginx/sites-available/fastsewa
# Enable:   ln -s /etc/nginx/sites-available/fastsewa /etc/nginx/sites-enabled/
# SSL:      certbot --nginx -d api.yourdomain.com
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m   rate=5r/m;

# ── API Server ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.yourdomain.com;

    # Redirect all HTTP → HTTPS (Certbot fills this in automatically)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options             DENY                                          always;
    add_header X-Content-Type-Options      nosniff                                       always;
    add_header Referrer-Policy             strict-origin-when-cross-origin               always;
    add_header X-XSS-Protection            "1; mode=block"                               always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # Max upload size (for video uploads)
    client_max_body_size 512M;
    client_body_timeout  300s;

    # Health check (no rate limit)
    location = /api/health {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }

    # Auth endpoints (strict rate limit)
    location ~ ^/api/v1/auth/(login|register) {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    # All other API routes (normal rate limit)
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    # Admin panel (static HTML — serve directly)
    location /admin/ {
        alias /app/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # Static file uploads (development only — use Cloudinary/S3 in prod)
    location /uploads/ {
        alias /app/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Block common attack paths
    location ~* \.(env|git|sql|bak|log)$ {
        return 404;
    }
}

# ── Proxy params helper ───────────────────────────────────────────────────────
# /etc/nginx/proxy_params should contain:
# proxy_set_header Host               $host;
# proxy_set_header X-Real-IP          $remote_addr;
# proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto  $scheme;
# proxy_http_version 1.1;
# proxy_set_header Upgrade            $http_upgrade;
# proxy_set_header Connection         "upgrade";
# proxy_read_timeout 90;
