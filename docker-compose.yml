version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       fastsewa_db
      POSTGRES_USER:     fastsewa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastsewa -d fastsewa_db"]
      interval: 10s
      timeout:  5s
      retries:  5
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — never expose to internet

  # ── Redis (API response cache + rate-limit store) ───────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── API Server ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV:        production
      PORT:            5000
      DATABASE_URL:    postgresql://fastsewa:${DB_PASSWORD}@db:5432/fastsewa_db
      JWT_SECRET:      ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      REDIS_URL:       redis://:${REDIS_PASSWORD}@redis:6379
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY:    ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout:  10s
      retries:  3

volumes:
  postgres_data:
  redis_data:
