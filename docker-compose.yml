version: "3.9"

services:

  # ── PostgreSQL (LOCAL/SELF-HOSTED ONLY — opt-in) ────────────────────────────
  # Production points DATABASE_URL at a managed provider (Neon/Supabase/
  # Render Postgres/etc — see .env.example) and doesn't need this service at
  # all. It's kept here only for self-hosted VPS/staging setups. Start it
  # explicitly with: docker compose --profile local-db up
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_DB:       fastsewa_db
      POSTGRES_USER:     fastsewa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastsewa -d fastsewa_db"]
      interval: 10s
      timeout:  5s
      retries:  5
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — never expose to internet

  # ── Redis (rate-limit store) ─────────────────────────────────────────────────
  # Used by server/routes.ts for a shared rate-limit counter across API
  # instances. Optional — if REDIS_URL isn't set, the app falls back to an
  # in-memory limiter automatically (fine for a single instance / local dev).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── API Server ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV:        production
      PORT:            5000
      # Reads DATABASE_URL straight from your .env — point it at Neon/
      # Supabase/Render Postgres/etc for production. Only set it to the
      # local `db:5432` form below if you activated --profile local-db.
      DATABASE_URL:    ${DATABASE_URL}
      JWT_SECRET:      ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      REDIS_URL:       redis://:${REDIS_PASSWORD}@redis:6379
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY:    ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST:     ${SMTP_HOST:-}
      SMTP_PORT:     ${SMTP_PORT:-}
      SMTP_USER:     ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM:     ${SMTP_FROM:-}
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
      # local-db users: run `docker compose --profile local-db up -d db`
      # first and give it a few seconds before starting `api`, since this
      # depends_on can't conditionally include a profiled-out service.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout:  10s
      retries:  3

volumes:
  postgres_data:
  redis_data:
